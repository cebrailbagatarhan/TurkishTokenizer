name: Tokenizer CLI tests
on:
  push:
    paths:
      - 'inspect_tokenizer.py'
      - 'test_inspect_tokenizer.py'
      - '.github/workflows/tokenizer-cli.yml'
  pull_request:
    paths:
      - 'inspect_tokenizer.py'
      - 'test_inspect_tokenizer.py'
      - '.github/workflows/tokenizer-cli.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_inspect_tokenizer.py
      - run: python -m py_compile inspect_tokenizer.py test_inspect_tokenizer.py
